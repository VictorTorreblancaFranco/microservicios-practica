# SERVICE
# Expone los pods a la red. Se usa NodePort para probar desde fuera del cluster local.

apiVersion: v1
kind: Service
metadata:
  name: victortorreblanca-productos-service
  namespace: victortorreblanca
  labels:
    app: victortorreblanca-productos
spec:
  selector:
    app: victortorreblanca-productos
  type: NodePort
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: victortorreblanca-pedidos-service
  namespace: victortorreblanca
  labels:
    app: victortorreblanca-pedidos
spec:
  selector:
    app: victortorreblanca-pedidos
  type: NodePort
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
      nodePort: 30082
